<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>CampusGig — Student Freelance Marketplace</title>
    <meta name="description" content="CampusGig is the peer-to-peer student freelance marketplace. Hire verified college students for web development, design, writing, academic projects and more — or earn money with your skills." />
    <meta name="keywords" content="student freelance, campus gig, college marketplace, student jobs, peer to peer, student skills, web development students, design students" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CampusGig — Student Freelance Marketplace" />
    <meta property="og:description" content="Hire verified college students or earn money with your skills. The campus peer-to-peer gig economy." />
    <meta property="og:site_name" content="CampusGig" />

    <!-- Favicon — emoji-based SVG (no file needed) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Razorpay SDK — loaded early to avoid checkout delays -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
